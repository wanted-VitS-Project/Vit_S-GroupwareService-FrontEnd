# ① VitaminS Frontend (Next.js SSR) — EC2 /opt/frontend 에서 기동
# 런타임 비밀값 없음: NEXT_PUBLIC_API_BASE_URL 은 빌드 시점에 이미 이미지에 박혀 있다.
services:
  frontend:
    image: ${ECR_REGISTRY}/team05/frontend:latest
    container_name: vitamins-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 모니터링 exporter (Prometheus 스크레이프: node :9100, cAdvisor :8081) ──
  #   접근 제한: 이 박스 SG 인바운드 9100·8081 은 모니터링 SG 에서만 허용.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    # privileged 대신 최소 권한: /dev/kmsg 만 부여(비privileged 로 컨테이너 메트릭 수집 확인됨)
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
